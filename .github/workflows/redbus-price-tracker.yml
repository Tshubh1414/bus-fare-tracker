name: RedBus fare snapshots

on:
  schedule:
    # Runs every five minutes (UTC schedule). Use only where automated collection is permitted.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redbus-fare-snapshot
  cancel-in-progress: true

jobs:
  collect-fares:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Verify Chrome and ChromeDriver versions
        run: |
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version
          "${{ steps.setup-chrome.outputs.chromedriver-path }}" --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Open search page and collect visible results
        env:
          HEADLESS: 'true'
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: python redbus_to_csv.py

      - name: Upload diagnostics if extraction fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redbus-diagnostics
          path: |
            redbus_no_results.png
            redbus_page_title.txt
            redbus_block_or_challenge.png
            redbus_parse_failed.png
            redbus_timeout.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit CSV history
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redbus_bangalore_to_nashik_2026-10-30.csv
          if git diff --cached --quiet; then
            echo 'No CSV changes to commit.'
          else
            git commit -m 'Update RedBus fare history'
            git push
          fi
